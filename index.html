<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeStash</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #4fd1c5;
    --text: #e8e6f0;
    --muted: #6b6880;
    --danger: #f56565;
    --success: #48bb78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* ── AUTH SCREEN ── */
  #authScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: var(--bg);
  }

  .auth-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.4s ease;
  }

  .auth-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .auth-logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .auth-logo span { color: var(--accent); }

  .auth-tabs {
    display: flex;
    gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 28px;
  }

  .auth-tab {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .auth-tab.active {
    background: var(--accent);
    color: white;
    font-weight: 600;
  }

  .auth-field {
    margin-bottom: 14px;
  }

  .auth-field label {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 7px;
  }

  .auth-field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .auth-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.12);
  }

  .auth-error {
    font-size: 0.78rem;
    color: var(--danger);
    margin-bottom: 12px;
    display: none;
    padding: 10px 14px;
    background: rgba(245,101,101,0.08);
    border: 1px solid rgba(245,101,101,0.2);
    border-radius: 8px;
  }

  .auth-error.show { display: block; }

  /* ── MAIN APP ── */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
    display: none;
  }

  .container.visible { display: block; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .dot.error { background: var(--danger); }

  .btn-signout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-signout:hover { border-color: var(--danger); color: var(--danger); }

  .upload-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
    animation: fadeUp 0.4s ease;
  }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  input[type="text"], select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.12);
  }

  select option { background: var(--surface2); }

  textarea {
    height: 180px;
    resize: vertical;
    line-height: 1.6;
    tab-size: 2;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9b8aff);
    color: white;
    width: 100%;
    justify-content: center;
    margin-top: 4px;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,106,247,0.35);
  }

  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .snippets-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .snippets-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .count-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .search-bar {
    position: relative;
    margin-bottom: 20px;
  }

  .search-bar input { padding-left: 40px; }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }

  .snippets-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .snippet-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    animation: fadeUp 0.3s ease;
    transition: border-color 0.2s;
  }

  .snippet-card:hover { border-color: var(--accent); }

  .snippet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .snippet-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }

  .lang-badge {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 5px;
    background: rgba(124,106,247,0.15);
    color: var(--accent);
    white-space: nowrap;
    border: 1px solid rgba(124,106,247,0.25);
    flex-shrink: 0;
  }

  .snippet-name {
    font-size: 0.9rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .snippet-date {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .snippet-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    margin-left: 12px;
  }

  .icon-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .icon-btn.copy-success { border-color: var(--success); color: var(--success); }

  .snippet-body {
    display: none;
    padding: 0;
  }

  .snippet-body.open { display: block; }

  .code-block {
    padding: 18px;
    font-size: 0.82rem;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    color: var(--accent2);
    border-top: 1px solid var(--border);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.8;
  }

  .big-icon { font-size: 2.5rem; margin-bottom: 12px; }

  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.82rem;
    color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 8px;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  /* ── DEVTOOLS OVERLAY ── */
  #devtoolsOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    font-family: 'Syne', sans-serif;
  }

  #devtoolsOverlay.show { display: flex; }

  #devtoolsOverlay .big-icon { font-size: 3rem; }

  #devtoolsOverlay h2 {
    font-size: 1.4rem;
    color: var(--danger);
    font-weight: 800;
  }

  #devtoolsOverlay p { color: var(--muted); font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .input-row { grid-template-columns: 1fr; }
    .snippet-date { display: none; }
  }
</style>
</head>
<body>

<!-- DevTools Overlay -->
<div id="devtoolsOverlay">
  <div class="big-icon">🔒</div>
  <h2>Access Restricted</h2>
  <p>Close developer tools to continue.</p>
</div>

<!-- Auth Screen -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">⚡</div>
      <h1>Code<span>Stash</span></h1>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-field">
      <label>Email</label>
      <input type="text" id="authEmail" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Sign In</button>
  </div>
</div>

<!-- Main App -->
<div class="container" id="appContainer">
  <header>
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>Code<span>Stash</span></h1>
    </div>
    <div class="header-right">
      <div class="status-dot">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">connecting...</span>
      </div>
      <button class="btn-signout" onclick="signOut()">sign out</button>
    </div>
  </header>

  <div class="upload-panel">
    <div class="panel-title">// new snippet</div>
    <div class="input-row">
      <input type="text" id="snippetName" placeholder="Snippet name (e.g. FFT solver)" />
      <select id="snippetLang">
        <option value="python">Python</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="matlab">MATLAB</option>
        <option value="javascript">JavaScript</option>
        <option value="bash">Bash</option>
        <option value="r">R</option>
        <option value="julia">Julia</option>
        <option value="text">Plain text</option>
        <option value="other">Other</option>
      </select>
    </div>
    <textarea id="snippetCode" placeholder="Paste your code here..."></textarea>
    <button class="btn btn-primary" onclick="saveSnippet()">⬆ Save Snippet</button>
  </div>

  <div class="snippets-header">
    <div class="snippets-title">Saved Snippets</div>
    <div class="count-badge" id="countBadge">0</div>
  </div>

  <div class="search-bar">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search snippets..." oninput="renderSnippets()" />
  </div>

  <div class="snippets-list" id="snippetsList">
    <div class="empty-state">
      <div class="big-icon">📋</div>
      <p>No snippets yet.<br>Save your first code above.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  // ── ANTI-INSPECT ──────────────────────────────────────
  // 1. Disable right-click
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // 2. Block keyboard shortcuts for devtools / view-source
  document.addEventListener('keydown', function(e) {
    const blocked = (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) ||
      (e.ctrlKey && e.key.toUpperCase() === 'U') ||
      (e.metaKey && e.altKey && ['I','J','C'].includes(e.key.toUpperCase()))
    );
    if (blocked) { e.preventDefault(); e.stopPropagation(); return false; }
  });

  // 3. DevTools size detection
  const _dt = { threshold: 160 };
  function checkDevTools() {
    const widthDiff  = window.outerWidth  - window.innerWidth  > _dt.threshold;
    const heightDiff = window.outerHeight - window.innerHeight > _dt.threshold;
    const overlay = document.getElementById('devtoolsOverlay');
    if (overlay) overlay.classList.toggle('show', widthDiff || heightDiff);
  }
  setInterval(checkDevTools, 1000);
  window.addEventListener('resize', checkDevTools);

  // 4. Console trap — clears console and warns on open
  const _noop = function(){};
  try {
    Object.defineProperty(console, '_commandLineAPI', { get: function(){ throw new Error('devtools'); } });
  } catch(e) {}

  // ── CONFIG (obfuscated) ──────────────────────────────
  const _c = 'https://sdliegtdpqjtpfkvsqrr.supabase.co';
  const _k = ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ','pc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbGllZ3R','kcHFqdHBma3ZzcXJyIiwicm9sZSI6ImFub24iLCJ','pYXQiOjE3NzE2OTI5OTksImV4cCI6MjA4NzI2ODk','5OX0.BIsvIPB02ydNwh36hmwKSrf9MwfXwJjvIo3','BLH8UDpU'].join('');

  // ── SESSION ──────────────────────────────────────────
  let _session = null;
  let snippets = [];
  let _authMode = 'login';

  function _headers(token) {
    return {
      'apikey': _k,
      'Authorization': 'Bearer ' + (token || _k),
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };
  }

  // ── AUTH ─────────────────────────────────────────────
  function switchTab(mode) {
    _authMode = mode;
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && mode === 'login') || (i === 1 && mode === 'signup'));
    });
    document.getElementById('authBtn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    document.getElementById('authError').classList.remove('show');
  }

  async function handleAuth() {
    const email    = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl    = document.getElementById('authError');
    const btn      = document.getElementById('authBtn');

    if (!email || !password) { showAuthError('Please fill in all fields.'); return; }

    btn.disabled = true;
    btn.textContent = _authMode === 'login' ? 'Signing in...' : 'Creating account...';

    try {
      let url, body;
      if (_authMode === 'login') {
        url  = _c + '/auth/v1/token?grant_type=password';
        body = JSON.stringify({ email, password });
      } else {
        url  = _c + '/auth/v1/signup';
        body = JSON.stringify({ email, password });
      }

      const res  = await fetch(url, { method: 'POST', headers: { 'apikey': _k, 'Content-Type': 'application/json' }, body });
      const data = await res.json();

      if (!res.ok) { showAuthError(data.error_description || data.msg || 'Authentication failed.'); return; }
      if (_authMode === 'signup' && !data.access_token) {
        showAuthError('Check your email to confirm your account, then sign in.');
        btn.disabled = false; btn.textContent = 'Create Account'; return;
      }

      _session = data;
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('appContainer').classList.add('visible');
      fetchSnippets();
    } catch(err) {
      showAuthError('Network error. Check your connection.');
    } finally {
      btn.disabled = false;
      btn.textContent = _authMode === 'login' ? 'Sign In' : 'Create Account';
    }
  }

  function showAuthError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.classList.add('show');
  }

  function signOut() {
    _session = null;
    snippets = [];
    document.getElementById('appContainer').classList.remove('visible');
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
  }

  // ── SNIPPETS ──────────────────────────────────────────
  async function fetchSnippets() {
    if (!_session) return;
    try {
      const res = await fetch(_c + '/rest/v1/snippets?order=created_at.desc', { headers: _headers(_session.access_token) });
      if (res.status === 401) { signOut(); return; }
      if (!res.ok) throw new Error();
      snippets = await res.json();
      setStatus('connected', 'connected');
      renderSnippets();
    } catch { setStatus('connection error', 'error'); }
  }

  async function saveSnippet() {
    const name     = document.getElementById('snippetName').value.trim();
    const language = document.getElementById('snippetLang').value;
    const code     = document.getElementById('snippetCode').value.trim();

    if (!name) { showToast('⚠ Give your snippet a name', 'error'); return; }
    if (!code) { showToast('⚠ Code cannot be empty', 'error'); return; }

    try {
      const res = await fetch(_c + '/rest/v1/snippets', {
        method: 'POST',
        headers: _headers(_session.access_token),
        body: JSON.stringify({ name, language, code, user_id: _session.user.id })
      });
      if (!res.ok) throw new Error();
      const [saved] = await res.json();
      snippets.unshift(saved);
      renderSnippets();
      document.getElementById('snippetName').value = '';
      document.getElementById('snippetCode').value = '';
      showToast('✓ Snippet saved!', 'success');
    } catch { showToast('✗ Failed to save', 'error'); }
  }

  async function deleteSnippet(id, el) {
    el.textContent = '...';
    try {
      await fetch(_c + '/rest/v1/snippets?id=eq.' + id, { method: 'DELETE', headers: _headers(_session.access_token) });
      snippets = snippets.filter(function(s) { return s.id !== id; });
      renderSnippets();
      showToast('Snippet deleted', '');
    } catch { showToast('✗ Delete failed', 'error'); el.textContent = 'del'; }
  }

  function renderSnippets() {
    const query    = document.getElementById('searchInput').value.toLowerCase();
    const filtered = snippets.filter(function(s) {
      return s.name.toLowerCase().includes(query) || s.language.toLowerCase().includes(query);
    });

    document.getElementById('countBadge').textContent = snippets.length;
    const list = document.getElementById('snippetsList');

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="big-icon">📋</div><p>' + (snippets.length ? 'No matches found.' : 'No snippets yet.<br>Save your first code above.') + '</p></div>';
      return;
    }

    list.innerHTML = filtered.map(function(s) {
      return '<div class="snippet-card">' +
        '<div class="snippet-header" onclick="toggleCard(\'' + s.id + '\')">' +
          '<div class="snippet-meta">' +
            '<span class="lang-badge">' + s.language + '</span>' +
            '<span class="snippet-name">' + escHtml(s.name) + '</span>' +
            '<span class="snippet-date">' + relTime(s.created_at) + '</span>' +
          '</div>' +
          '<div class="snippet-actions">' +
            '<button class="icon-btn" id="copy-' + s.id + '" onclick="event.stopPropagation(); copySnippet(\'' + s.id + '\')">copy</button>' +
            '<button class="icon-btn danger" onclick="event.stopPropagation(); deleteSnippet(\'' + s.id + '\', this)">del</button>' +
          '</div>' +
        '</div>' +
        '<div class="snippet-body" id="body-' + s.id + '">' +
          '<div class="code-block">' + escHtml(s.code) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function toggleCard(id) {
    document.getElementById('body-' + id).classList.toggle('open');
  }

  function copySnippet(id) {
    const s = snippets.find(function(x) { return x.id === id; });
    if (!s) return;
    navigator.clipboard.writeText(s.code).then(function() {
      const btn = document.getElementById('copy-' + id);
      btn.textContent = 'copied!';
      btn.classList.add('copy-success');
      setTimeout(function() { btn.textContent = 'copy'; btn.classList.remove('copy-success'); }, 2000);
    });
  }

  // ── UTILS ─────────────────────────────────────────────
  function setStatus(text, type) {
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusDot').className = 'dot ' + (type || '');
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function relTime(iso) {
    const d = new Date(iso), now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60)    return 'just now';
    if (diff < 3600)  return Math.floor(diff/60)   + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600)  + 'h ago';
    return d.toLocaleDateString();
  }

  // Tab key in textarea
  document.getElementById('snippetCode').addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = e.target, s = ta.selectionStart;
      ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  });

  // Enter key on auth inputs
  ['authEmail','authPassword'].forEach(function(id) {
    document.getElementById(id).addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleAuth();
    });
  });

  // Expose needed functions to global scope
  window.switchTab     = switchTab;
  window.handleAuth    = handleAuth;
  window.signOut       = signOut;
  window.saveSnippet   = saveSnippet;
  window.deleteSnippet = deleteSnippet;
  window.toggleCard    = toggleCard;
  window.copySnippet   = copySnippet;
  window.renderSnippets = renderSnippets;

  setInterval(function() { if (_session) fetchSnippets(); }, 30000);
})();
</script>
